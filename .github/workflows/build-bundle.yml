name: build-bundle

# Builds the rizin + rz-ghidra bundle for macOS (Apple Silicon and Intel) and Windows from the pins in VERSIONS, self-tests
# each one from a moved folder, and uploads it as a build artifact. Run it by hand (Actions > build-bundle > Run workflow);
# tick "publish" to also attach the three zips (and their SHA-256 files) to a GitHub Release named after VERSIONS.
# Nothing here is signed: the application's own release step signs and notarizes everything in its publish folder.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also create (or update) the GitHub Release for these versions'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64, os: macos-14 }
          # GitHub retires runner images over time; if this label stops resolving, pick the current Intel macOS image.
          - { rid: osx-x64, os: macos-15-intel }
          - { rid: win-x64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and self-test (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/build-macos.sh

      - name: Build and self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write      # asked for here, by this job only (the repository's default token is read-only)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundle-*
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source VERSIONS
          TAG="bundle-rizin${RIZIN_VERSION}-rzghidra${RZ_GHIDRA_VERSION}-r${BUNDLE_REVISION}"
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "rizin ${RIZIN_VERSION} + rz-ghidra ${RZ_GHIDRA_VERSION} (revision ${BUNDLE_REVISION})" \
              --notes "Unsigned, relocatable bundles of rizin ${RIZIN_VERSION} and the rz-ghidra ${RZ_GHIDRA_VERSION} decompiler plugin for osx-arm64, osx-x64 and win-x64, built from the pins in VERSIONS at commit ${GITHUB_SHA}. Each zip has a .sha256 file. See README.md for contents, licences and the source offer."
          fi
